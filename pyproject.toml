[project]
name = "signal-news"
version = "0.1.0"
description = "Signal: a local-first news collector and daily digest for finance, cybersecurity and embedded/IoT/homelab news."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Travis Levine" }]
dependencies = [
    "apprise>=1.8",
    "apscheduler>=3.10,<4",
    "fastapi>=0.115",
    "feedparser>=6.0.11",
    "httpx>=0.27",
    "jinja2>=3.1",
    "markdown>=3.6",
    "markdownify>=0.13",
    "numpy>=1.26",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "readability-lxml>=0.8.1",
    "ruamel.yaml>=0.18",
    "trafilatura>=1.12",
    "typer>=0.12",
    "tzdata>=2024.1",
    "uvicorn>=0.30",
]

[project.scripts]
signal = "signal_news.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["signal_news"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
