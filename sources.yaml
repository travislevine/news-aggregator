# Signal news sources
# ---------------------------------------------------------------------------
# Fields: name, url, topic (finance | cyber | iot), type (rss | json | google_news | hnrss),
# enabled, fetch_full_text, paywalled, priority (1 = best, 3 = lowest), notes.
# Optional: query (google_news), keyword_filter (keep only matching items),
# fallback_urls (tried by `signal validate-sources`), extra_topics (also tag as another topic).
#
# Run `signal validate-sources` to check every feed. Dead feeds are disabled with a note,
# never silently dropped. Per-ticker watchlist feeds are generated from config.yaml.

sources:
  # ------------------------------------------------------------- Cybersecurity
  - name: BleepingComputer
    url: https://www.bleepingcomputer.com/feed/
    topic: cyber
    type: rss
    enabled: true
    fetch_full_text: true
    paywalled: false
    priority: 1
    notes: ""
  - name: The Hacker News
    url: https://feeds.feedburner.com/TheHackersNews
    topic: cyber
    type: rss
    enabled: true
    fetch_full_text: true
    paywalled: false
    priority: 1
    notes: ""
  - name: Krebs on Security
    url: https://krebsonsecurity.com/feed/
    topic: cyber
    type: rss
    enabled: true
    fetch_full_text: false
    paywalled: false
    priority: 1
    notes: "Feed carries full posts"
  - name: SecurityWeek
    url: https://www.securityweek.com/feed/
    topic: cyber
    type: rss
    enabled: true
    fetch_full_text: true
    paywalled: false
    priority: 1
    notes: ""
  - name: The Record
    url: https://therecord.media/feed
    topic: cyber
    type: rss
    enabled: true
    fetch_full_text: true
    paywalled: false
    priority: 1
    notes: "Recorded Future News"
  - name: Dark Reading
    url: https://www.darkreading.com/rss.xml
    topic: cyber
    type: rss
    enabled: true
    fetch_full_text: true
    paywalled: false
    priority: 2
    notes: ""
  - name: Ars Technica Security
    url: https://feeds.arstechnica.com/arstechnica/security
    topic: cyber
    type: rss
    enabled: true
    fetch_full_text: true
    paywalled: false
    priority: 1
    notes: ""
  - name: SANS Internet Storm Center
    url: https://isc.sans.edu/rssfeed_full.xml
    topic: cyber
    type: rss
    enabled: true
    fetch_full_text: false
    paywalled: false
    priority: 2
    notes: "Full-text diary feed"
  - name: Schneier on Security
    url: https://www.schneier.com/feed/atom/
    topic: cyber
    type: rss
    enabled: true
    fetch_full_text: false
    paywalled: false
    priority: 2
    notes: ""
  - name: CISA Advisories
    url: https://www.cisa.gov/cybersecurity-advisories/all.xml
    topic: cyber
    type: rss
    enabled: true
    fetch_full_text: true
    paywalled: false
    priority: 1
    notes: ""
  - name: CISA KEV
    url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
    topic: cyber
    type: json
    enabled: true
    fetch_full_text: false
    paywalled: false
    priority: 1
    notes: "Known Exploited Vulnerabilities catalog. New entries become articles and are always in the digest."
  - name: ASD ACSC Alerts
    url: https://www.cyber.gov.au/rss/alerts
    topic: cyber
    type: rss
    enabled: true
    fetch_full_text: true
    paywalled: false
    priority: 1
    notes: "Australian Signals Directorate"
    fallback_urls:
      - https://www.cyber.gov.au/acsc/view-all-content/alerts/rss
  - name: Hacker News Security
    url: https://hnrss.org/newest?q=security+OR+vulnerability+OR+CVE+OR+breach&points=100
    topic: cyber
    type: hnrss
    enabled: true
    fetch_full_text: true
    paywalled: false
    priority: 2
    notes: "Links to the article; the HN discussion URL is stored as hn_url"
  - name: rekt.news
    url: https://rekt.news/
    topic: cyber
    type: rss
    enabled: true
    fetch_full_text: true
    paywalled: false
    priority: 1
    notes: "DeFi exploit post-mortems. Feed URL found by autodiscovery."
    fallback_urls:
      - https://rekt.news/rss/feed.xml
  - name: Cointelegraph (security)
    url: https://cointelegraph.com/rss
    topic: cyber
    type: rss
    enabled: true
    fetch_full_text: true
    paywalled: false
    priority: 2
    notes: "Only security-relevant items are kept"
    keyword_filter: [hack, hacked, exploit, drained, breach, stolen, vulnerability, phishing, rug, scam, attacker]
  - name: CoinDesk (security)
    url: https://www.coindesk.com/arc/outboundfeeds/rss/
    topic: cyber
    type: rss
    enabled: true
    fetch_full_text: true
    paywalled: false
    priority: 2
    notes: "Only security-relevant items are kept"
    keyword_filter: [hack, hacked, exploit, drained, breach, stolen, vulnerability, phishing, rug, scam, attacker]
  - name: "Google News: crypto hacks"
    topic: cyber
    type: google_news
    query: 'crypto (hack OR exploit OR drained OR "stolen funds") when:1d'
    enabled: true
    fetch_full_text: true
    paywalled: false
    priority: 3
    notes: ""

